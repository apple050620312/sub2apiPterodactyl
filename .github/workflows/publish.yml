name: Publish Pterodactyl image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - scripts/**
      - .github/workflows/publish.yml
  schedule:
    # Rebuild regularly so the latest tag follows the upstream Sub2API image.
    - cron: "23 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/apple050620312/sub2api-pterodactyl
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: sub2api-pterodactyl:smoke
          cache-from: type=gha

      - name: Smoke test initialization, health, and shutdown
        run: bash scripts/smoke-test.sh sub2api-pterodactyl:smoke

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
